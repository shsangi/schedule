<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>CSS 2027 · Schedule</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
        body { background: #f2f6fc; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 10px; }
        .card { max-width: 640px; width: 100%; background: #ffffff; border-radius: 28px; box-shadow: 0 8px 24px rgba(0,0,0,0.04); padding: 16px 14px 18px; border: 1px solid rgba(0,20,40,0.03); }
        .banner { background: #0b1e33; color: white; border-radius: 60px; padding: 8px 20px; display: flex; align-items: center; gap: 10px; margin-bottom: 14px; min-height: 48px; cursor: pointer; transition: background 0.2s; }
        .banner:hover { background: #162d4a; }
        .banner-activity { display: flex; align-items: center; gap: 10px; flex: 1; }
        .status-dot { display: inline-block; width: 10px; height: 10px; background: #4ade80; border-radius: 50%; flex-shrink: 0; animation: pulse 1.8s infinite; }
        @keyframes pulse { 0% { opacity: 0.5; transform: scale(0.95); } 50% { opacity: 1; transform: scale(1.1); } 100% { opacity: 0.5; transform: scale(0.95); } }
        .banner-subject { font-weight: 600; font-size: 0.95rem; line-height: 1.3; letter-spacing: 0.2px; word-break: break-word; }
        .banner-hint { font-size: 0.7rem; opacity: 0.6; margin-left: 4px; }
        .status-bar { display: flex; justify-content: space-between; align-items: center; gap: 8px; background: #f1f5f9; padding: 6px 14px; border-radius: 40px; margin-bottom: 12px; font-size: 0.8rem; font-weight: 500; color: #1e293b; flex-wrap: wrap; }
        .status-bar .done-count { color: #1a4b8c; display: flex; align-items: center; gap: 4px; }
        .status-bar .done-count span { background: #b3d0ff; padding: 0 10px; border-radius: 20px; color: #0b2b5e; font-weight: 700; }
        .status-bar .remaining-time { color: #b91c1c; font-weight: 700; background: #fee9e7; padding: 0 14px; border-radius: 20px; font-size: 0.9rem; display: flex; align-items: center; gap: 4px; white-space: nowrap; }
        .status-bar .remaining-time .time-num { font-feature-settings: "tnum"; }
        .status-bar .remaining-count { color: #b91c1c; display: flex; align-items: center; gap: 4px; }
        .status-bar .remaining-count span { background: #fee9e7; padding: 0 10px; border-radius: 20px; color: #b91c1c; font-weight: 700; }
        .schedule-grid { display: flex; flex-direction: column; gap: 3px; margin-top: 4px; }
        .row { display: flex; align-items: center; padding: 6px 10px; border-radius: 40px; background: #fafcff; border: 1px solid #e9edf3; transition: 0.1s ease; font-size: 0.82rem; gap: 4px; cursor: pointer; }
        .row:hover { background: #f0f4ff; border-color: #b3d0ff; }
        .row .srno { font-weight: 600; color: #475569; min-width: 28px; font-size: 0.7rem; text-align: center; }
        .row .time { font-weight: 600; color: #1e293b; min-width: 62px; font-size: 0.7rem; letter-spacing: 0.2px; }
        .row .subject { flex: 1; font-weight: 500; color: #0b1e33; padding: 0 4px; font-size: 0.8rem; }
        .row .duration-badge { background: #e9edf3; padding: 1px 12px; border-radius: 40px; font-size: 0.65rem; font-weight: 600; color: #1e293b; white-space: nowrap; }
        .row.done { background: #e6f0ff; border-color: #b3d0ff; }
        .row.done .subject { color: #1a4b8c; }
        .row.done .duration-badge { background: #b3d0ff; color: #0b2b5e; }
        .row.current { background: #fee9e7; border-color: #e53e3e; box-shadow: 0 2px 8px rgba(229,62,62,0.08); }
        .row.current .subject { color: #b91c1c; font-weight: 600; }
        .row.current .duration-badge { background: #e53e3e; color: white; }
        .row.current .srno { color: #b91c1c; }
        .row.current .time { color: #b91c1c; }
        .row.upcoming { background: #fafcff; border-color: #e9edf3; }
        .row.break-row { background: #f1f5f9; border-color: #d9e1ec; }
        .row.break-row .subject { color: #334155; }
        .row.break-row.done { background: #e2e8f0; border-color: #cbd5e1; }
        .row.break-row.current { background: #fee9e7; border-color: #e53e3e; }
        .footer { margin-top: 14px; display: flex; justify-content: space-between; align-items: center; font-size: 0.7rem; color: #5e6f8d; border-top: 1px solid #e2e8f0; padding-top: 12px; flex-wrap: wrap; gap: 6px; }
        .footer .pkt-clock { background: #eef2f6; padding: 4px 14px; border-radius: 20px; font-weight: 500; color: #1e293b; font-size: 0.75rem; }
        .footer .exam-dates { display: flex; gap: 12px; font-weight: 500; color: #0b1e33; flex-wrap: wrap; }
        .footer .exam-dates .mpt-date { background: #dbeafe; padding: 2px 12px; border-radius: 20px; color: #1a4b8c; }
        .footer .exam-dates .written-date { background: #fee9e7; padding: 2px 12px; border-radius: 20px; color: #b91c1c; }
        .footer .exam-dates .count-days { font-weight: 700; margin-left: 2px; }
        .loading-text { text-align: center; padding: 20px; color: #5e6f8d; font-size: 0.9rem; }
        .loading-text small { color: #94a3b8; font-size: 0.75rem; display: block; margin-top: 4px; }
        .error-text { text-align: center; padding: 20px; color: #b91c1c; font-size: 0.9rem; }
        .error-text small { color: #94a3b8; font-size: 0.75rem; display: block; margin-top: 4px; }
        .details-panel { background: #f8fafc; border-radius: 16px; padding: 16px; margin-top: 12px; border: 1px solid #e2e8f0; display: none; }
        .details-panel.active { display: block; }
        .details-panel h4 { color: #0b1e33; margin-bottom: 10px; font-size: 0.9rem; }
        .details-panel .detail-item { display: flex; padding: 4px 0; font-size: 0.8rem; border-bottom: 1px solid #eef2f6; }
        .details-panel .detail-item .label { font-weight: 600; color: #475569; min-width: 100px; }
        .details-panel .detail-item .value { color: #0b1e33; }
        .details-panel .close-btn { float: right; background: none; border: none; color: #94a3b8; font-size: 1.2rem; cursor: pointer; padding: 0 4px; }
        .details-panel .close-btn:hover { color: #475569; }
        @media (max-width: 480px) { .card { padding: 12px 8px; } .banner { padding: 6px 14px; min-height: 40px; } .banner-subject { font-size: 0.8rem; } .row { padding: 5px 6px; font-size: 0.72rem; } .row .srno { min-width: 22px; font-size: 0.65rem; } .row .time { min-width: 52px; font-size: 0.65rem; } .row .duration-badge { font-size: 0.6rem; padding: 0 10px; } .row .subject { font-size: 0.7rem; } .status-bar { font-size: 0.7rem; padding: 4px 10px; gap: 4px; } .status-bar .remaining-time { font-size: 0.75rem; padding: 0 10px; } .footer { font-size: 0.6rem; flex-direction: column; align-items: stretch; gap: 4px; } .footer .exam-dates { justify-content: center; } .details-panel .detail-item .label { min-width: 70px; } }
    </style>
</head>
<body>
<div class="card">
    <div class="banner" id="bannerClick">
        <div class="banner-activity">
            <span class="status-dot"></span>
            <span class="banner-subject" id="currentActivity">Loading schedule…</span>
            <span class="banner-hint">👆 Click for details</span>
        </div>
    </div>

    <div class="status-bar">
        <span class="done-count">✅ Done: <span id="doneCount">0</span></span>
        <span class="remaining-time">⏳ <span class="time-num" id="remainingTimeMinutes">--</span>:<span class="time-num" id="remainingTimeSeconds">--</span></span>
        <span class="remaining-count">⏳ Left: <span id="remainingCount">0</span></span>
    </div>

    <div class="schedule-grid" id="scheduleContainer">
        <div class="loading-text">⏳ Loading from Google Sheet…<br><small>Please wait</small></div>
    </div>

    <div class="details-panel" id="detailsPanel">
        <button class="close-btn" onclick="closeDetails()">✕</button>
        <h4 id="detailTitle">Activity Details</h4>
        <div id="detailContent"></div>
    </div>

    <div class="footer">
        <div class="exam-dates">
            <span class="mpt-date">📝 MPT: <span id="mptDateDisplay">--</span> <span class="count-days" id="mptDays">--</span>d</span>
            <span class="written-date">✍️ Written: <span id="writtenDateDisplay">--</span> <span class="count-days" id="writtenDays">--</span>d</span>
        </div>
        <span class="pkt-clock" id="pkTimeDisplay">🇵🇰 <span id="pkTime">--:-- --</span></span>
    </div>
</div>

<script>
// CONFIGURATION - Update these URLs for your sheets
const SHEET_ID = '2PACX-1vTX16x-Eeh1mguy6se1B25x0hkRIzIme4pX71KlxpML_vZAD34mtlITIqFs8MCAVycXFFft82j1RZDc';

// Main schedule sheet - reads from column A (Activity Name)
const SCHEDULE_URL = `https://docs.google.com/spreadsheets/d/e/${SHEET_ID}/pub?output=csv`;

// Details sheet - reads from column B (Activity Name) for lookup
const DETAILS_URL = `https://docs.google.com/spreadsheets/d/e/${SHEET_ID}/pub?gid=0&output=csv`;

let schedule = [];
let detailsData = {};
let mptDate = null;
let writtenDate = null;
let currentActivityName = '';

const $ = id => document.getElementById(id);
const container = $('scheduleContainer');
const currentActivity = $('currentActivity');
const remainingMinutes = $('remainingTimeMinutes');
const remainingSeconds = $('remainingTimeSeconds');
const pkTime = $('pkTime');
const doneCount = $('doneCount');
const remainingCount = $('remainingCount');
const mptDays = $('mptDays');
const writtenDays = $('writtenDays');
const mptDateDisplay = $('mptDateDisplay');
const writtenDateDisplay = $('writtenDateDisplay');
const detailsPanel = $('detailsPanel');
const detailTitle = $('detailTitle');
const detailContent = $('detailContent');

function getPakistanTime() {
    const now = new Date();
    return new Date(now.getTime() + (now.getTimezoneOffset() * 60000) + (5 * 60 * 60000));
}

function formatFullDateTime(d) {
    const days = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
    const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
    let h = d.getHours() % 12 || 12;
    return `${days[d.getDay()]}, ${d.getDate()} ${months[d.getMonth()]}, ${d.getFullYear()}, ${h}:${String(d.getMinutes()).padStart(2,'0')}:${String(d.getSeconds()).padStart(2,'0')} ${d.getHours() >= 12 ? 'PM' : 'AM'}`;
}

function parseDate(str) {
    if (!str) return null;
    const parts = str.trim().split(' ');
    if (parts.length !== 3) return null;
    const months = { 'jan': 0, 'feb': 1, 'mar': 2, 'apr': 3, 'may': 4, 'jun': 5, 'jul': 6, 'aug': 7, 'sep': 8, 'oct': 9, 'nov': 10, 'dec': 11 };
    const month = months[parts[1].toLowerCase().substring(0, 3)];
    if (month === undefined) return null;
    return new Date(parseInt(parts[2]), month, parseInt(parts[0]));
}

function getDaysUntil(target, now) {
    if (!target) return '--';
    const t = new Date(target); t.setHours(0,0,0,0);
    const n = new Date(now); n.setHours(0,0,0,0);
    return Math.max(0, Math.ceil((t - n) / (1000 * 60 * 60 * 24)));
}

// Parse main schedule sheet - Column A is Activity Name
function parseScheduleCSV(text) {
    const lines = text.split('\n').filter(l => l.trim());
    if (lines.length < 2) return null;
    
    const headers = lines[0].split(',').map(h => h.trim().toLowerCase());
    
    // Find columns: A=subject/activity, B=from, C=to, D=duration, E=type
    const idx = {
        subject: 0, // Column A
        from: headers.findIndex(h => h === 'from' || h === 'start'),
        to: headers.findIndex(h => h === 'to' || h === 'end'),
        duration: headers.findIndex(h => h === 'duration' || h === 'time'),
        type: headers.findIndex(h => h === 'type' || h === 'activitytype'),
        mpt: headers.findIndex(h => h.includes('mpt') || h.includes('test date')),
        written: headers.findIndex(h => h.includes('written') || h.includes('exam'))
    };

    // If headers not found, use column positions (A=0, B=1, C=2, D=3)
    if (idx.from === -1) idx.from = 1;
    if (idx.to === -1) idx.to = 2;
    if (idx.duration === -1) idx.duration = 3;

    const data = [];
    let mptStr = null, writtenStr = null;

    for (let i = 1; i < lines.length; i++) {
        const cols = lines[i].split(',').map(c => c.trim());
        if (cols.length < 4 || cols.every(c => !c)) continue;

        const subject = cols[idx.subject] || '';
        let from = (idx.from >= 0 && idx.from < cols.length ? cols[idx.from] : '').replace(/\s/g, '');
        let to = (idx.to >= 0 && idx.to < cols.length ? cols[idx.to] : '').replace(/\s/g, '');
        let duration = (idx.duration >= 0 && idx.duration < cols.length ? cols[idx.duration] : '').replace(/\s/g, '');

        if (idx.mpt >= 0 && cols[idx.mpt]?.match(/\d{1,2}\s+[A-Za-z]{3}\s+\d{4}/)) mptStr = cols[idx.mpt];
        if (idx.written >= 0 && cols[idx.written]?.match(/\d{1,2}\s+[A-Za-z]{3}\s+\d{4}/)) writtenStr = cols[idx.written];

        if (!from || !to || !subject) continue;
        if (from.length === 4) from = '0' + from;
        if (to.length === 4) to = '0' + to;
        if (!/^\d{2}:\d{2}$/.test(from) || !/^\d{2}:\d{2}$/.test(to)) continue;

        if (!duration || !duration.match(/^\d+[hm]/i)) {
            const diff = parseInt(to.split(':')[0]) - parseInt(from.split(':')[0]);
            duration = (diff > 0 && diff <= 24) ? diff + 'h' : '1h';
        }

        let type = 'compulsory';
        if (idx.type >= 0 && cols[idx.type]) {
            const t = cols[idx.type].toLowerCase();
            if (['core','compulsory','optional','mpt','review','break','sleep'].includes(t)) type = t;
        } else {
            const s = subject.toLowerCase();
            if (s.includes('break') || s.includes('lunch') || s.includes('dinner')) type = 'break';
            else if (s.includes('sleep') || s.includes('rest')) type = 'sleep';
            else if (s.includes('mpt') || s.includes('practice')) type = 'mpt';
            else if (s.includes('review')) type = 'review';
            else if (s.includes('essay') || s.includes('precis')) type = 'core';
            else if (s.includes('optional')) type = 'optional';
        }

        data.push({ from, to, duration, subject, type });
    }

    if (mptStr) { const d = parseDate(mptStr); if (d) { mptDate = d; mptDateDisplay.textContent = mptStr; } }
    if (writtenStr) { const d = parseDate(writtenStr); if (d) { writtenDate = d; writtenDateDisplay.textContent = writtenStr; } }

    return data.length ? data : null;
}

// Parse details sheet - Column B is Activity Name (lookup key)
function parseDetailsCSV(text) {
    const lines = text.split('\n').filter(l => l.trim());
    if (lines.length < 2) return;
    
    const headers = lines[0].split(',').map(h => h.trim());
    
    // Column B is Activity Name (index 1)
    const activityNameIdx = 1;
    const activityName = headers[activityNameIdx] || 'Activity Name';
    
    // Build details data using Column B as the key
    for (let i = 1; i < lines.length; i++) {
        const cols = lines[i].split(',').map(c => c.trim());
        if (cols.length < 2 || cols.every(c => !c)) continue;
        
        const key = cols[activityNameIdx] || '';
        if (!key) continue;
        
        detailsData[key] = {};
        for (let j = 0; j < headers.length; j++) {
            if (j !== activityNameIdx && cols[j]) {
                const label = headers[j] || `Column ${j}`;
                detailsData[key][label] = cols[j];
            }
        }
    }
    
    console.log('📋 Loaded details for', Object.keys(detailsData).length, 'activities');
    console.log('🔍 Lookup keys:', Object.keys(detailsData).slice(0, 5));
}

async function loadSchedule() {
    try {
        // Load main schedule
        const scheduleRes = await fetch(SCHEDULE_URL, { cache: 'no-store' });
        if (!scheduleRes.ok) throw new Error('Failed to fetch schedule');
        const scheduleText = await scheduleRes.text();
        const parsed = parseScheduleCSV(scheduleText);
        if (!parsed || !parsed.length) throw new Error('No schedule data found');
        schedule = parsed;

        // Load details sheet
        try {
            const detailsRes = await fetch(DETAILS_URL, { cache: 'no-store' });
            if (detailsRes.ok) {
                const detailsText = await detailsRes.text();
                parseDetailsCSV(detailsText);
            } else {
                console.log('⚠️ Details sheet not found, using only schedule');
            }
        } catch (e) {
            console.log('⚠️ Could not load details sheet:', e.message);
        }

        return true;
    } catch (e) {
        console.error('Error:', e);
        return false;
    }
}

function getCurrent(now) {
    const secs = now.getHours() * 3600 + now.getMinutes() * 60 + now.getSeconds();
    let idx = -1, remain = 0;

    for (let i = 0; i < schedule.length; i++) {
        const [fh, fm] = schedule[i].from.split(':').map(Number);
        const [th, tm] = schedule[i].to.split(':').map(Number);
        const from = fh * 3600 + fm * 60;
        let to = th * 3600 + tm * 60;

        if (to < from) {
            if (secs >= from || secs < to) {
                idx = i;
                remain = secs >= from ? (86400 - secs) + to : to - secs;
                break;
            }
        } else if (secs >= from && secs < to) {
            idx = i;
            remain = to - secs;
            break;
        }
    }

    if (idx === -1) {
        let min = Infinity;
        for (let i = 0; i < schedule.length; i++) {
            const [h, m] = schedule[i].from.split(':').map(Number);
            let diff = h * 3600 + m * 60 - secs;
            if (diff < 0) diff += 86400;
            if (diff < min) { min = diff; idx = i; }
        }
        remain = min;
    }

    return { idx: Math.max(0, idx), remain };
}

function showDetails(activityName) {
    // Clean the activity name for lookup
    const cleanName = activityName.trim();
    const details = detailsData[cleanName];
    
    if (!details || Object.keys(details).length === 0) {
        detailContent.innerHTML = `<p style="color: #94a3b8; font-size: 0.85rem;">No additional details available for "${cleanName}"</p>`;
    } else {
        let html = '';
        for (const [key, value] of Object.entries(details)) {
            if (value && value.trim()) {
                html += `<div class="detail-item"><span class="label">${key}:</span><span class="value">${value}</span></div>`;
            }
        }
        detailContent.innerHTML = html || '<p style="color: #94a3b8; font-size: 0.85rem;">No additional details available.</p>';
    }
    detailTitle.textContent = `📋 ${cleanName}`;
    detailsPanel.classList.add('active');
}

function closeDetails() {
    detailsPanel.classList.remove('active');
}

function render() {
    const now = getPakistanTime();
    pkTime.textContent = formatFullDateTime(now);

    if (mptDate) mptDays.textContent = getDaysUntil(mptDate, now);
    if (writtenDate) writtenDays.textContent = getDaysUntil(writtenDate, now);

    const { idx, remain } = getCurrent(now);
    const item = schedule[idx] || { subject: 'No schedule', type: '' };
    currentActivityName = item.subject;

    const prefix = { core: '📘 ', compulsory: '📖 ', optional: '📚 ', mpt: '📝 ', review: '📋 ' };
    let activity = item.subject;
    if (item.type === 'break') activity = '☕ ' + activity;
    else if (item.type === 'sleep') activity = '🌙 ' + activity;
    else if (prefix[item.type]) activity = prefix[item.type] + activity;
    currentActivity.textContent = activity;

    const mins = Math.floor(remain / 60);
    const secs = Math.floor(remain % 60);
    remainingMinutes.textContent = String(mins).padStart(2, '0');
    remainingSeconds.textContent = String(secs).padStart(2, '0');

    let html = '', done = 0, left = 0;
    for (let i = 0; i < schedule.length; i++) {
        const s = schedule[i];
        const isBreak = s.type === 'break' || s.type === 'sleep';
        let cls = 'row';
        if (i < idx) { cls += ' done'; done++; }
        else if (i === idx) { cls += ' current'; left++; }
        else { left++; }
        if (isBreak) cls += ' break-row';

        const emoji = { core: ' ✏️', compulsory: ' 📖', optional: ' 📚', mpt: ' 📝', review: ' 📘', break: '', sleep: ' 🌙' };
        const hasDetails = detailsData[s.subject] && Object.keys(detailsData[s.subject]).length > 0;
        const escapedSubject = s.subject.replace(/'/g, "\\'").replace(/"/g, '&quot;');
        html += `<div class="${cls}" onclick="showDetails('${escapedSubject}')" title="${hasDetails ? 'Click for details' : ''}">
            <span class="srno">${i + 1}</span>
            <span class="time">${s.from} – ${s.to}</span>
            <span class="subject">${s.subject}${emoji[s.type] || ''}${hasDetails ? ' 📋' : ''}</span>
            <span class="duration-badge">${s.duration}</span>
        </div>`;
    }

    container.innerHTML = html;
    doneCount.textContent = done;
    remainingCount.textContent = left;
}

// Click banner to show current activity details
document.getElementById('bannerClick').addEventListener('click', function() {
    if (currentActivityName) {
        showDetails(currentActivityName);
    }
});

async function init() {
    const loaded = await loadSchedule();
    if (!loaded) {
        container.innerHTML = '<div class="error-text">❌ Failed to load schedule<br><small>Please check your internet connection and try refreshing</small></div>';
        return;
    }
    render();
    setInterval(render, 1000);
}

document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
