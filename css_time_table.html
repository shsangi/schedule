<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>CSS 2027 · Dynamic Schedule</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif; }
        body { background: #f2f6fc; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 10px; }
        .card { max-width: 640px; width: 100%; background: #ffffff; border-radius: 28px; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.04); padding: 16px 14px 18px; border: 1px solid rgba(0,20,40,0.03); }
        .banner { background: #0b1e33; color: white; border-radius: 60px; padding: 8px 20px; display: flex; align-items: center; gap: 10px; margin-bottom: 14px; min-height: 48px; }
        .banner-activity { display: flex; align-items: center; gap: 10px; flex: 1; }
        .status-dot { display: inline-block; width: 10px; height: 10px; background: #4ade80; border-radius: 50%; flex-shrink: 0; animation: pulse 1.8s infinite; }
        @keyframes pulse { 0% { opacity: 0.5; transform: scale(0.95); } 50% { opacity: 1; transform: scale(1.1); } 100% { opacity: 0.5; transform: scale(0.95); } }
        .banner-subject { font-weight: 600; font-size: 0.95rem; line-height: 1.3; letter-spacing: 0.2px; word-break: break-word; }
        .status-bar { display: flex; justify-content: space-between; align-items: center; gap: 8px; background: #f1f5f9; padding: 6px 14px; border-radius: 40px; margin-bottom: 12px; font-size: 0.8rem; font-weight: 500; color: #1e293b; flex-wrap: wrap; }
        .status-bar .done-count { color: #1a4b8c; display: flex; align-items: center; gap: 4px; }
        .status-bar .done-count span { background: #b3d0ff; padding: 0 10px; border-radius: 20px; color: #0b2b5e; font-weight: 700; }
        .status-bar .remaining-time { color: #b91c1c; font-weight: 700; background: #fee9e7; padding: 0 14px; border-radius: 20px; font-size: 0.9rem; display: flex; align-items: center; gap: 4px; white-space: nowrap; }
        .status-bar .remaining-time .time-num { font-feature-settings: "tnum"; }
        .status-bar .remaining-count { color: #b91c1c; display: flex; align-items: center; gap: 4px; }
        .status-bar .remaining-count span { background: #fee9e7; padding: 0 10px; border-radius: 20px; color: #b91c1c; font-weight: 700; }
        .schedule-grid { display: flex; flex-direction: column; gap: 3px; margin-top: 4px; }
        .row { display: flex; align-items: center; padding: 6px 10px; border-radius: 40px; background: #fafcff; border: 1px solid #e9edf3; transition: 0.1s ease; font-size: 0.82rem; gap: 4px; cursor: pointer; }
        .row:hover { background: #e8edf5; transform: scale(1.01); }
        .row .srno { font-weight: 600; color: #475569; min-width: 28px; font-size: 0.7rem; text-align: center; }
        .row .time { font-weight: 600; color: #1e293b; min-width: 62px; font-size: 0.7rem; letter-spacing: 0.2px; }
        .row .subject { flex: 1; font-weight: 500; color: #0b1e33; padding: 0 4px; font-size: 0.8rem; }
        .row .duration-badge { background: #e9edf3; padding: 1px 12px; border-radius: 40px; font-size: 0.65rem; font-weight: 600; color: #1e293b; white-space: nowrap; }
        .row .click-hint { font-size: 0.6rem; color: #94a3b8; margin-left: 4px; }
        .row .record-count { font-size: 0.55rem; background: #dbeafe; padding: 1px 8px; border-radius: 12px; color: #1a4b8c; margin-left: 4px; }
        .row.done { background: #e6f0ff; border-color: #b3d0ff; }
        .row.done .subject { color: #1a4b8c; }
        .row.done .duration-badge { background: #b3d0ff; color: #0b2b5e; }
        .row.current { background: #fee9e7; border-color: #e53e3e; box-shadow: 0 2px 8px rgba(229,62,62,0.08); }
        .row.current .subject { color: #b91c1c; font-weight: 600; }
        .row.current .duration-badge { background: #e53e3e; color: white; }
        .row.current .srno { color: #b91c1c; }
        .row.current .time { color: #b91c1c; }
        .row.upcoming { background: #fafcff; border-color: #e9edf3; }
        .row.break-row { background: #f1f5f9; border-color: #d9e1ec; }
        .row.break-row .subject { color: #334155; }
        .row.break-row.done { background: #e2e8f0; border-color: #cbd5e1; }
        .row.break-row.current { background: #fee9e7; border-color: #e53e3e; }
        .footer { margin-top: 14px; display: flex; justify-content: space-between; align-items: center; font-size: 0.7rem; color: #5e6f8d; border-top: 1px solid #e2e8f0; padding-top: 12px; flex-wrap: wrap; gap: 6px; }
        .footer .pkt-clock { background: #eef2f6; padding: 4px 14px; border-radius: 20px; font-weight: 500; color: #1e293b; font-size: 0.75rem; }
        .footer .exam-dates { display: flex; gap: 12px; font-weight: 500; color: #0b1e33; flex-wrap: wrap; }
        .footer .exam-dates .mpt-date { background: #dbeafe; padding: 2px 12px; border-radius: 20px; color: #1a4b8c; }
        .footer .exam-dates .written-date { background: #fee9e7; padding: 2px 12px; border-radius: 20px; color: #b91c1c; }
        .footer .exam-dates .count-days { font-weight: 700; margin-left: 2px; }
        .loading-text { text-align: center; padding: 20px; color: #5e6f8d; font-size: 0.9rem; }
        .loading-text small { color: #94a3b8; font-size: 0.75rem; display: block; margin-top: 4px; }
        .cache-badge { background: #dbeafe; padding: 2px 10px; border-radius: 20px; font-size: 0.6rem; color: #1a4b8c; margin-left: 8px; }

        /* Modal/Popup Styles */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); backdrop-filter: blur(4px); z-index: 1000; display: none; justify-content: center; align-items: center; padding: 20px; animation: fadeIn 0.3s ease; }
        .modal-overlay.active { display: flex; }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
        .modal { background: #ffffff; border-radius: 24px; max-width: 550px; width: 100%; max-height: 90vh; overflow-y: auto; padding: 24px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); position: relative; }
        .modal-close { position: absolute; top: 12px; right: 16px; background: none; border: none; font-size: 1.5rem; color: #94a3b8; cursor: pointer; padding: 4px 10px; border-radius: 50%; transition: 0.2s; }
        .modal-close:hover { background: #f1f5f9; color: #1e293b; }
        .modal-header { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; padding-right: 30px; }
        .modal-header .modal-icon { font-size: 2rem; }
        .modal-header h2 { font-size: 1.2rem; color: #0b1e33; line-height: 1.3; }
        .modal-header .modal-badge { background: #e9edf3; padding: 2px 14px; border-radius: 20px; font-size: 0.7rem; font-weight: 600; color: #475569; }
        .modal-header .modal-count { background: #dbeafe; padding: 2px 12px; border-radius: 20px; font-size: 0.7rem; font-weight: 600; color: #1a4b8c; margin-left: 8px; }
        .modal-body { color: #334155; }
        .modal-body .detail-section { margin-bottom: 16px; }
        .modal-body .detail-section h4 { font-size: 0.8rem; color: #64748b; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }
        .modal-body .detail-section p, .modal-body .detail-section li { font-size: 0.9rem; line-height: 1.6; color: #1e293b; }
        .modal-body .detail-section ul { list-style: none; padding: 0; }
        .modal-body .detail-section ul li { padding: 6px 0; border-bottom: 1px solid #f1f5f9; display: flex; gap: 8px; align-items: baseline; }
        .modal-body .detail-section ul li:before { content: "▸"; color: #3b82f6; font-weight: 700; }
        .modal-body .detail-section .resource-link { display: inline-block; background: #eff6ff; color: #1a4b8c; padding: 4px 14px; border-radius: 20px; font-size: 0.8rem; text-decoration: none; margin: 3px 4px 3px 0; transition: 0.2s; }
        .modal-body .detail-section .resource-link:hover { background: #dbeafe; }
        .modal-body .time-details { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; background: #f8fafc; padding: 12px; border-radius: 12px; margin: 8px 0; }
        .modal-body .time-details span { font-size: 0.85rem; color: #475569; }
        .modal-body .time-details strong { color: #0b1e33; }
        .modal-body .priority-badge { display: inline-block; padding: 2px 12px; border-radius: 20px; font-size: 0.7rem; font-weight: 600; }
        .priority-high { background: #fee2e2; color: #dc2626; }
        .priority-medium { background: #fef3c7; color: #d97706; }
        .priority-low { background: #d1fae5; color: #059669; }
        
        /* Agenda Items */
        .modal-body .agenda-item { background: #f8fafc; padding: 12px 14px; border-radius: 10px; margin-bottom: 10px; border-left: 4px solid #3b82f6; }
        .modal-body .agenda-item .agenda-date { font-size: 0.7rem; color: #64748b; margin-bottom: 6px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
        .modal-body .agenda-item .agenda-text { font-size: 0.9rem; color: #1e293b; }
        .modal-body .agenda-item .agenda-text .agenda-line { padding: 2px 0; }
        .modal-body .agenda-item .agenda-remarks { font-size: 0.8rem; color: #64748b; margin-top: 6px; font-style: italic; }
        .modal-body .agenda-item .agenda-link { font-size: 0.8rem; margin-top: 6px; }
        .modal-body .agenda-item .agenda-link a { color: #3b82f6; text-decoration: none; word-break: break-all; }
        .modal-body .agenda-item .agenda-link a:hover { text-decoration: underline; }
        .modal-body .agenda-item .agenda-todo { font-size: 0.75rem; color: #059669; font-weight: 600; }
        .modal-body .no-records { text-align: center; padding: 20px; color: #94a3b8; }

        @media (max-width: 480px) { 
            .card { padding: 12px 8px; } 
            .banner { padding: 6px 14px; min-height: 40px; } 
            .banner-subject { font-size: 0.8rem; } 
            .row { padding: 5px 6px; font-size: 0.72rem; } 
            .row .srno { min-width: 22px; font-size: 0.65rem; } 
            .row .time { min-width: 52px; font-size: 0.65rem; } 
            .row .duration-badge { font-size: 0.6rem; padding: 0 10px; } 
            .row .subject { font-size: 0.7rem; } 
            .row .record-count { font-size: 0.5rem; padding: 1px 6px; }
            .status-bar { font-size: 0.7rem; padding: 4px 10px; gap: 4px; } 
            .status-bar .remaining-time { font-size: 0.75rem; padding: 0 10px; } 
            .footer { font-size: 0.6rem; flex-direction: column; align-items: stretch; gap: 4px; } 
            .footer .exam-dates { justify-content: center; } 
            .modal { padding: 16px; margin: 10px; }
            .modal-body .time-details { grid-template-columns: 1fr; }
            .modal-body .agenda-item { padding: 10px 12px; }
        }
    </style>
</head>
<body>
<div class="card" id="app">
    <div class="banner">
        <div class="banner-activity">
            <span class="status-dot"></span>
            <span class="banner-subject" id="currentActivity">Loading schedule…</span>
        </div>
    </div>

    <div class="status-bar">
        <span class="done-count">✅ Done: <span id="doneCount">0</span></span>
        <span class="remaining-time" id="remainingTimeDisplay">⏳ <span class="time-num" id="remainingTimeMinutes">--</span>:<span class="time-num" id="remainingTimeSeconds">--</span></span>
        <span class="remaining-count">⏳ Left: <span id="remainingCount">0</span></span>
    </div>

    <div class="schedule-grid" id="scheduleContainer">
        <div class="loading-text">⏳ Loading schedule…</div>
    </div>

    <div class="footer">
        <div class="exam-dates">
            <span class="mpt-date">📝 MPT: <span id="mptDateDisplay">10 Oct 2026</span> <span class="count-days" id="mptDays">--</span>d</span>
            <span class="written-date">✍️ Written: <span id="writtenDateDisplay">27 Jan 2027</span> <span class="count-days" id="writtenDays">--</span>d</span>
        </div>
        <span class="pkt-clock" id="pkTimeDisplay">🇵🇰 <span id="pkTime">--:-- --</span></span>
    </div>
</div>

<!-- Modal Popup -->
<div class="modal-overlay" id="modalOverlay">
    <div class="modal">
        <button class="modal-close" id="modalClose">✕</button>
        <div class="modal-header">
            <span class="modal-icon" id="modalIcon">📚</span>
            <div>
                <h2 id="modalTitle">Activity Details</h2>
                <span class="modal-badge" id="modalType">Compulsory</span>
                <span class="modal-count" id="modalRecordCount">0 records</span>
            </div>
        </div>
        <div class="modal-body" id="modalBody">
            <div class="time-details" id="modalTimeDetails">
                <span>⏰ <strong id="modalFrom">--:--</strong> – <strong id="modalTo">--:--</strong></span>
                <span>📊 Duration: <strong id="modalDuration">--</strong></span>
            </div>
            <div class="detail-section">
                <h4>📋 All Records <span style="font-weight:normal;font-size:0.7rem;color:#94a3b8;">(Newest first)</span></h4>
                <div id="modalAgendaList">
                    <div class="no-records">Loading records...</div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    (function() {
        // ----- FALLBACK SCHEDULE -----
        const FALLBACK_SCHEDULE = [
            { from: "05:00", to: "08:00", duration: "3h", subject: "English Essay & Précis and Reading", type: "core" },
            { from: "08:00", to: "09:00", duration: "1h", subject: "GSA (General Science & Ability)", type: "compulsory" },
            { from: "09:00", to: "10:00", duration: "1h", subject: "Pakistan Affairs", type: "compulsory" },
            { from: "10:00", to: "11:00", duration: "1h", subject: "Current Affairs", type: "compulsory" },
            { from: "11:00", to: "12:00", duration: "1h", subject: "Islamic Studies", type: "compulsory" },
            { from: "12:00", to: "13:00", duration: "1h", subject: "Optional 1 (Computer Science)", type: "optional" },
            { from: "13:00", to: "14:00", duration: "1h", subject: "☕ Break · Lunch & Zohr", type: "break" },
            { from: "14:00", to: "15:00", duration: "1h", subject: "Optional 2 (Public Administration)", type: "optional" },
            { from: "15:00", to: "16:00", duration: "1h", subject: "Optional 3 (History of USA)", type: "optional" },
            { from: "16:00", to: "17:00", duration: "1h", subject: "Optional 4 (Criminology)", type: "optional" },
            { from: "17:00", to: "18:00", duration: "1h", subject: "Optional 5 (Gender studies)", type: "optional" },
            { from: "18:00", to: "19:00", duration: "1h", subject: "Optional 1 (Computer Science) or English Grammer", type: "optional" },
            { from: "19:00", to: "20:00", duration: "1h", subject: "☕ Break · Dinner & Isha", type: "break" },
            { from: "20:00", to: "22:00", duration: "2h", subject: "MPT Practice Test (MCQs)", type: "mpt" },
            { from: "22:00", to: "23:00", duration: "1h", subject: "Review · Notes", type: "review" },
            { from: "23:00", to: "05:00", duration: "6h", subject: "🌙 Sleep · Night rest", type: "sleep" }
        ];

        let mptDate = new Date(2026, 9, 10);
        let writtenDate = new Date(2027, 0, 27);
        let schedule = [...FALLBACK_SCHEDULE];
        
        // Cache for activity details
        let activityDetailsCache = {};
        let detailsLoaded = false;

        // ----- GOOGLE SHEET URLs -----
        // REPLACE THESE WITH YOUR PUBLISHED CSV URLs
        const SCHEDULE_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTX16x-Eeh1mguy6se1B25x0hkRIzIme4pX71KlxpML_vZAD34mtlITIqFs8MCAVycXFFft82j1RZDc/pub?output=csv';
        const DETAILS_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTX16x-Eeh1mguy6se1B25x0hkRIzIme4pX71KlxpML_vZAD34mtlITIqFs8MCAVycXFFft82j1RZDc/pub?output=csv'; // REPLACE WITH YOUR DETAILS SHEET URL

        // ----- DOM refs -----
        const container = document.getElementById('scheduleContainer');
        const currentActivityEl = document.getElementById('currentActivity');
        const remainingTimeMinutesEl = document.getElementById('remainingTimeMinutes');
        const remainingTimeSecondsEl = document.getElementById('remainingTimeSeconds');
        const pkTimeEl = document.getElementById('pkTime');
        const pkTimeDisplayEl = document.getElementById('pkTimeDisplay');
        const doneCountEl = document.getElementById('doneCount');
        const remainingCountEl = document.getElementById('remainingCount');
        const mptDaysEl = document.getElementById('mptDays');
        const writtenDaysEl = document.getElementById('writtenDays');
        const mptDateDisplayEl = document.getElementById('mptDateDisplay');
        const writtenDateDisplayEl = document.getElementById('writtenDateDisplay');

        // Modal refs
        const modalOverlay = document.getElementById('modalOverlay');
        const modalClose = document.getElementById('modalClose');
        const modalIcon = document.getElementById('modalIcon');
        const modalTitle = document.getElementById('modalTitle');
        const modalType = document.getElementById('modalType');
        const modalRecordCount = document.getElementById('modalRecordCount');
        const modalFrom = document.getElementById('modalFrom');
        const modalTo = document.getElementById('modalTo');
        const modalDuration = document.getElementById('modalDuration');
        const modalAgendaList = document.getElementById('modalAgendaList');

        // ----- Parse CSV (Schedule) -----
        function parseCSVToSchedule(csvText) {
            const lines = csvText.split('\n').filter(line => line.trim() !== '');
            if (lines.length < 2) return null;

            const headers = lines[0].split(',').map(h => h.trim().toLowerCase());
            const activityIdx = headers.findIndex(h => h.includes('activity') || h.includes('subject'));
            const fromIdx = headers.findIndex(h => h === 'from' || h === 'start');
            const toIdx = headers.findIndex(h => h === 'to' || h === 'end');
            const durationIdx = headers.findIndex(h => h === 'duration' || h === 'time');
            const typeIdx = headers.findIndex(h => h === 'type' || h === 'activitytype');
            const mptDateIdx = headers.findIndex(h => h.includes('mpt') || h.includes('test date'));
            const writtenDateIdx = headers.findIndex(h => h.includes('written') || h.includes('exam'));

            const parsed = [];
            let mptDateFound = null;
            let writtenDateFound = null;

            for (let i = 1; i < lines.length; i++) {
                const cols = lines[i].split(',').map(c => c.trim());
                if (cols.length < 4) continue;
                if (cols.every(c => c === '')) continue;

                let subject = activityIdx !== -1 ? cols[activityIdx] : cols[0] || '';
                let from = (fromIdx !== -1 ? cols[fromIdx] : cols[1] || '').replace(/\s/g, '');
                let to = (toIdx !== -1 ? cols[toIdx] : cols[2] || '').replace(/\s/g, '');
                let duration = (durationIdx !== -1 ? cols[durationIdx] : cols[3] || '').replace(/\s/g, '');

                if (mptDateIdx !== -1 && cols.length > mptDateIdx && cols[mptDateIdx]) {
                    const dateStr = cols[mptDateIdx].trim();
                    if (dateStr.match(/\d{1,2}\s+[A-Za-z]{3}\s+\d{4}/)) mptDateFound = dateStr;
                }
                if (writtenDateIdx !== -1 && cols.length > writtenDateIdx && cols[writtenDateIdx]) {
                    const dateStr = cols[writtenDateIdx].trim();
                    if (dateStr.match(/\d{1,2}\s+[A-Za-z]{3}\s+\d{4}/)) writtenDateFound = dateStr;
                }

                if (!from || !to || !subject) continue;
                if (from.length === 4) from = '0' + from;
                if (to.length === 4) to = '0' + to;
                if (!/^\d{2}:\d{2}$/.test(from) || !/^\d{2}:\d{2}$/.test(to)) continue;

                if (!duration || !duration.match(/^\d+[hm]/i)) {
                    const fromH = parseInt(from.split(':')[0]);
                    const toH = parseInt(to.split(':')[0]);
                    const diff = toH - fromH;
                    duration = (diff > 0 && diff <= 24) ? diff + 'h' : '1h';
                }

                let type = 'compulsory';
                if (typeIdx !== -1 && cols.length > typeIdx) {
                    const typeVal = cols[typeIdx].toLowerCase();
                    if (['core', 'compulsory', 'optional', 'mpt', 'review', 'break', 'sleep'].includes(typeVal)) type = typeVal;
                }

                parsed.push({ from, to, duration, subject, type });
            }

            if (mptDateFound) { const d = parseDateString(mptDateFound); if (d) { mptDate = d; mptDateDisplayEl.textContent = mptDateFound; } }
            if (writtenDateFound) { const d = parseDateString(writtenDateFound); if (d) { writtenDate = d; writtenDateDisplayEl.textContent = writtenDateFound; } }

            return parsed.length > 0 ? parsed : null;
        }

        // ----- Parse CSV (Activity Details) -----
        function parseCSVToDetails(csvText) {
            const lines = csvText.split('\n').filter(line => line.trim() !== '');
            if (lines.length < 2) return {};

            const headers = lines[0].split(',').map(h => h.trim().toLowerCase());
            
            const timestampIdx = headers.findIndex(h => h.includes('timestamp'));
            const activityIdx = headers.findIndex(h => h.includes('activity name') || h.includes('activity'));
            const agendaIdx = headers.findIndex(h => h.includes('agenda'));
            const dateTodoIdx = headers.findIndex(h => h.includes('date todo') || h.includes('date'));
            const refLinkIdx = headers.findIndex(h => h.includes('ref link') || h.includes('link') || h.includes('url'));
            const remarksIdx = headers.findIndex(h => h.includes('remarks') || h.includes('remark') || h.includes('note'));
            const priorityIdx = headers.findIndex(h => h.includes('priority'));

            const detailsMap = {};

            for (let i = 1; i < lines.length; i++) {
                const cols = lines[i].split(',').map(c => c.trim());
                if (cols.length < 2) continue;
                if (cols.every(c => c === '')) continue;

                let activityName = activityIdx !== -1 ? cols[activityIdx] : cols[0] || '';
                // Clean activity name for matching
                activityName = activityName.replace(/[☕🌙📚📖✏️📝📘📋]/g, '').trim();
                
                if (!activityName) continue;

                if (!detailsMap[activityName]) {
                    detailsMap[activityName] = [];
                }

                const detail = {
                    timestamp: timestampIdx !== -1 ? cols[timestampIdx] : '',
                    activityName: activityName,
                    agenda: agendaIdx !== -1 ? cols[agendaIdx].replace(/\\n/g, '\n').replace(/\n/g, '<br>') : '',
                    dateTodo: dateTodoIdx !== -1 ? cols[dateTodoIdx] : '',
                    refLink: refLinkIdx !== -1 ? cols[refLinkIdx] : '',
                    remarks: remarksIdx !== -1 ? cols[remarksIdx] : '',
                    priority: priorityIdx !== -1 ? cols[priorityIdx] : ''
                };

                detailsMap[activityName].push(detail);
            }

            // Sort each activity's details by timestamp (newest first)
            for (const key in detailsMap) {
                detailsMap[key].sort((a, b) => {
                    return new Date(b.timestamp) - new Date(a.timestamp);
                });
            }

            return detailsMap;
        }

        // ----- Parse date string -----
        function parseDateString(dateStr) {
            if (!dateStr || dateStr.trim() === '') return null;
            const parts = dateStr.trim().split(' ');
            if (parts.length !== 3) return null;
            const day = parseInt(parts[0]);
            const monthMap = { 'jan': 0, 'feb': 1, 'mar': 2, 'apr': 3, 'may': 4, 'jun': 5, 'jul': 6, 'aug': 7, 'sep': 8, 'oct': 9, 'nov': 10, 'dec': 11 };
            const month = monthMap[parts[1].toLowerCase().substring(0, 3)];
            if (month === undefined) return null;
            const year = parseInt(parts[2]);
            if (isNaN(day) || isNaN(year)) return null;
            return new Date(year, month, day);
        }

        // ----- Fetch schedule -----
        async function loadScheduleFromSheet() {
            try {
                const response = await fetch(SCHEDULE_CSV_URL, { cache: 'no-store', headers: { 'Cache-Control': 'no-cache' } });
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const csvText = await response.text();
                const parsed = parseCSVToSchedule(csvText);
                if (parsed && parsed.length > 0) {
                    schedule = parsed;
                    return true;
                }
                return false;
            } catch (error) {
                console.error('Error loading schedule:', error);
                return false;
            }
        }

        // ----- Fetch activity details -----
        async function loadActivityDetails() {
            try {
                const response = await fetch(DETAILS_CSV_URL, { cache: 'no-store', headers: { 'Cache-Control': 'no-cache' } });
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const csvText = await response.text();
                const parsed = parseCSVToDetails(csvText);
                if (Object.keys(parsed).length > 0) {
                    activityDetailsCache = parsed;
                    detailsLoaded = true;
                    return true;
                }
                return false;
            } catch (error) {
                console.error('Error loading activity details:', error);
                return false;
            }
        }

        // ----- Pakistan Time -----
        function getPakistanTime() {
            const now = new Date();
            const pkOffset = 5 * 60;
            const utc = now.getTime() + (now.getTimezoneOffset() * 60000);
            return new Date(utc + (pkOffset * 60000));
        }

        function formatFullDateTime(d) {
            const days = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
            const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
            
            const dayName = days[d.getDay()];
            const day = d.getDate();
            const month = months[d.getMonth()];
            const year = d.getFullYear();
            
            let hours = d.getHours();
            const minutes = d.getMinutes().toString().padStart(2, '0');
            const seconds = d.getSeconds().toString().padStart(2, '0');
            const ampm = hours >= 12 ? 'PM' : 'AM';
            hours = hours % 12 || 12;
            
            return `${dayName}, ${day} ${month}, ${year}, ${hours}:${minutes}:${seconds} ${ampm}`;
        }

        function formatDate(dateStr) {
            if (!dateStr) return '--';
            try {
                const d = new Date(dateStr);
                if (isNaN(d.getTime())) return dateStr;
                const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
                return `${d.getDate()} ${months[d.getMonth()]} ${d.getFullYear()}`;
            } catch {
                return dateStr;
            }
        }

        function getDaysUntil(targetDate, nowPK) {
            const target = new Date(targetDate);
            target.setHours(0, 0, 0, 0);
            const now = new Date(nowPK);
            now.setHours(0, 0, 0, 0);
            const diffTime = target.getTime() - now.getTime();
            return Math.ceil(diffTime / (1000 * 60 * 60 * 24));
        }

        // ----- Get current index & remaining seconds -----
        function getCurrentIndexAndRemaining(nowPK) {
            const nowSecondsInDay = (nowPK.getHours() * 3600) + (nowPK.getMinutes() * 60) + nowPK.getSeconds();
            let currentIdx = -1;
            let remainingSeconds = 0;

            for (let i = 0; i < schedule.length; i++) {
                const s = schedule[i];
                const fromParts = s.from.split(':').map(Number);
                const toParts = s.to.split(':').map(Number);
                const fromSec = (fromParts[0] * 3600) + (fromParts[1] * 60);
                let toSec = (toParts[0] * 3600) + (toParts[1] * 60);

                let isActive = false;
                if (toSec < fromSec) {
                    if (nowSecondsInDay >= fromSec || nowSecondsInDay < toSec) {
                        isActive = true;
                        if (nowSecondsInDay >= fromSec) remainingSeconds = (86400 - nowSecondsInDay) + toSec;
                        else remainingSeconds = toSec - nowSecondsInDay;
                    }
                } else {
                    if (nowSecondsInDay >= fromSec && nowSecondsInDay < toSec) {
                        isActive = true;
                        remainingSeconds = toSec - nowSecondsInDay;
                    }
                }
                if (isActive) { currentIdx = i; break; }
            }

            if (currentIdx === -1) {
                let minDiff = Infinity;
                let candidate = -1;
                for (let i = 0; i < schedule.length; i++) {
                    const s = schedule[i];
                    const fromParts = s.from.split(':').map(Number);
                    const fromSec = (fromParts[0] * 3600) + (fromParts[1] * 60);
                    let diff = fromSec - nowSecondsInDay;
                    if (diff < 0) diff += 86400;
                    if (diff < minDiff) { minDiff = diff; candidate = i; }
                }
                if (candidate !== -1) { currentIdx = candidate; remainingSeconds = minDiff; }
                else { currentIdx = 0; remainingSeconds = 0; }
            }
            return { currentIdx, remainingSeconds };
        }

        // ----- Show modal with ALL activity details -----
        function showModal(activityName, from, to, duration) {
            const cleanName = activityName.replace(/[☕🌙📚📖✏️📝📘📋]/g, '').trim();
            
            // Get ALL details from cache
            const details = activityDetailsCache[cleanName] || activityDetailsCache[activityName] || [];
            
            // Set basic info
            modalIcon.textContent = getIconForActivity(cleanName);
            modalTitle.textContent = cleanName;
            modalType.textContent = getTypeForActivity(cleanName);
            modalRecordCount.textContent = `${details.length} records`;
            modalFrom.textContent = from;
            modalTo.textContent = to;
            modalDuration.textContent = duration;

            // Build agenda list - ALL records displayed
            if (details.length > 0) {
                let html = '';
                details.forEach((detail, index) => {
                    const priority = detail.priority || '';
                    let priorityBadge = '';
                    if (priority) {
                        const pLower = priority.toLowerCase();
                        let badgeClass = 'priority-low';
                        if (pLower === 'high') badgeClass = 'priority-high';
                        else if (pLower === 'medium') badgeClass = 'priority-medium';
                        priorityBadge = `<span class="priority-badge ${badgeClass}">${priority}</span>`;
                    }

                    // Parse agenda items
                    const agendaItems = detail.agenda ? detail.agenda.split('<br>').filter(item => item.trim()) : [];
                    const agendaText = agendaItems.length > 0 ? 
                        agendaItems.map(item => `<div class="agenda-line">• ${item.trim()}</div>`).join('') : 
                        '<div class="agenda-line" style="color:#94a3b8;">No agenda items</div>';

                    html += `
                        <div class="agenda-item">
                            <div class="agenda-date">
                                📅 ${detail.timestamp ? new Date(detail.timestamp).toLocaleString() : 'Date not set'}
                                ${detail.dateTodo ? ` | 🎯 Todo: ${formatDate(detail.dateTodo)}` : ''}
                                ${priorityBadge}
                            </div>
                            <div class="agenda-text">${agendaText}</div>
                            ${detail.remarks ? `<div class="agenda-remarks">💡 ${detail.remarks}</div>` : ''}
                            ${detail.refLink ? `<div class="agenda-link">🔗 <a href="${detail.refLink}" target="_blank">${detail.refLink}</a></div>` : ''}
                        </div>
                    `;
                });
                modalAgendaList.innerHTML = html;
            } else {
                modalAgendaList.innerHTML = `
                    <div class="no-records">
                        📭 No agenda records found for this activity<br>
                        <small style="color:#94a3b8;">Add records in the "Activity Details" sheet</small>
                    </div>
                `;
            }

            modalOverlay.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        // ----- Helper functions for modal -----
        function getIconForActivity(name) {
            const icons = {
                'English Essay': '✏️',
                'GSA': '🔬',
                'Pakistan Affairs': '🇵🇰',
                'Current Affairs': '📰',
                'Islamic Studies': '🕌',
                'Computer Science': '💻',
                'Public Administration': '🏛️',
                'History of USA': '🇺🇸',
                'Criminology': '⚖️',
                'Gender studies': '👩‍⚖️',
                'English Grammer': '📝',
                'English Grammar': '📝',
                'MPT Practice': '📝',
                'Review': '📘',
                'Sleep': '🌙'
            };
            for (const [key, icon] of Object.entries(icons)) {
                if (name.includes(key)) return icon;
            }
            return '📚';
        }

        function getTypeForActivity(name) {
            if (name.includes('English Essay') || name.includes('GSA') || name.includes('Pakistan') || 
                name.includes('Current') || name.includes('Islamic')) {
                return 'Compulsory';
            }
            if (name.includes('Optional') || name.includes('Computer') || name.includes('History') || 
                name.includes('Criminology') || name.includes('Gender') || name.includes('Administration')) {
                return 'Optional';
            }
            if (name.includes('MPT')) return 'MPT';
            if (name.includes('Review')) return 'Review';
            if (name.includes('Break')) return 'Break';
            if (name.includes('Sleep')) return 'Rest';
            return 'Activity';
        }

        // ----- Close modal -----
        function closeModal() {
            modalOverlay.classList.remove('active');
            document.body.style.overflow = '';
        }

        // ----- Modal event listeners -----
        modalClose.addEventListener('click', closeModal);
        modalOverlay.addEventListener('click', (e) => {
            if (e.target === modalOverlay) closeModal();
        });
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeModal();
        });

        // ----- Render schedule -----
        function renderSchedule(currentIdx) {
            let html = '';
            let doneCount = 0;
            let remainingCount = 0;

            for (let i = 0; i < schedule.length; i++) {
                const s = schedule[i];
                const isBreak = s.type === 'break' || s.type === 'sleep';
                let rowClass = 'row';
                let status = 'upcoming';
                if (i < currentIdx) status = 'done';
                else if (i === currentIdx) status = 'current';

                if (status === 'done') { rowClass += ' done'; doneCount++; }
                else if (status === 'current') { rowClass += ' current'; remainingCount++; }
                else { remainingCount++; }
                if (isBreak) rowClass += ' break-row';

                const srno = i + 1;
                const timeLabel = `${s.from} – ${s.to}`;
                let subjectDisplay = s.subject;
                const typeEmoji = { 'core': ' ✏️', 'compulsory': ' 📖', 'optional': ' 📚', 'mpt': ' 📝', 'review': ' 📘', 'break': '', 'sleep': ' 🌙' };
                subjectDisplay += typeEmoji[s.type] || '';

                // Get record count for this activity
                const cleanName = s.subject.replace(/[☕🌙📚📖✏️📝📘📋]/g, '').trim();
                const recordCount = (activityDetailsCache[cleanName] || activityDetailsCache[s.subject] || []).length;
                const countBadge = recordCount > 0 ? `<span class="record-count">${recordCount} 📋</span>` : '';

                html += `<div class="${rowClass}" data-subject="${s.subject}" data-from="${s.from}" data-to="${s.to}" data-duration="${s.duration}">
                    <span class="srno">${srno}</span>
                    <span class="time">${timeLabel}</span>
                    <span class="subject">${subjectDisplay} ${countBadge}</span>
                    <span class="duration-badge">${s.duration}</span>
                    <span class="click-hint">ⓘ</span>
                </div>`;
            }

            container.innerHTML = html;
            doneCountEl.textContent = doneCount;
            remainingCountEl.textContent = remainingCount;

            // Add click event listeners to rows
            document.querySelectorAll('.row').forEach(row => {
                row.addEventListener('click', function() {
                    const subject = this.dataset.subject;
                    const from = this.dataset.from;
                    const to = this.dataset.to;
                    const duration = this.dataset.duration;
                    showModal(subject, from, to, duration);
                });
            });
        }

        // ----- Update UI -----
        function updateUI() {
            const nowPK = getPakistanTime();
            pkTimeDisplayEl.innerHTML = `🇵🇰 <span id="pkTime">${formatFullDateTime(nowPK)}</span>`;
            
            mptDaysEl.textContent = Math.max(0, getDaysUntil(mptDate, nowPK));
            writtenDaysEl.textContent = Math.max(0, getDaysUntil(writtenDate, nowPK));

            const { currentIdx, remainingSeconds } = getCurrentIndexAndRemaining(nowPK);
            const currentItem = schedule[currentIdx] || schedule[0];

            let activityText = currentItem.subject;
            const prefixMap = { 'core': '📘 ', 'compulsory': '📖 ', 'optional': '📚 ', 'mpt': '📝 ', 'review': '📋 ' };
            if (currentItem.type === 'break') activityText = '☕ ' + currentItem.subject.replace('☕ ', '');
            else if (currentItem.type === 'sleep') activityText = '🌙 ' + currentItem.subject.replace('🌙 ', '');
            else { const prefix = prefixMap[currentItem.type] || ''; activityText = prefix + currentItem.subject; }
            currentActivityEl.textContent = activityText;

            const mins = Math.floor(remainingSeconds / 60);
            const secs = Math.floor(remainingSeconds % 60);
            remainingTimeMinutesEl.textContent = String(mins).padStart(2, '0');
            remainingTimeSecondsEl.textContent = String(secs).padStart(2, '0');

            renderSchedule(currentIdx);
        }

        // ----- Init -----
        async function init() {
            container.innerHTML = '<div class="loading-text">⏳ Loading schedule…</div>';
            
            // Load schedule
            const scheduleLoaded = await loadScheduleFromSheet();
            
            // Load activity details in background
            loadActivityDetails().then(success => {
                if (success) {
                    console.log('✅ Activity details loaded');
                } else {
                    console.log('⚠️ Using fallback details');
                }
                // Re-render to show record counts
                const nowPK = getPakistanTime();
                const { currentIdx } = getCurrentIndexAndRemaining(nowPK);
                renderSchedule(currentIdx);
            });

            if (!scheduleLoaded) {
                container.innerHTML = '<div class="loading-text">⚠️ Using fallback schedule<br><small>Click any activity for details</small></div>';
            } else {
                container.innerHTML = '<div class="loading-text">✅ Schedule loaded! <span class="cache-badge">⚡ click any activity for details</span><br><small>CSS 2027 Study Plan</small></div>';
            }
            
            updateUI();
            setInterval(updateUI, 1000);
        }

        document.addEventListener('DOMContentLoaded', init);
    })();
</script>
